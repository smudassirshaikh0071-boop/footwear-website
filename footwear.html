<html>
<head>
<style>
body {
  font-family: Arial;
  background-color: #f5f5f5;
  margin: 0;
}
.header {
  background-color: #222;
  color: white;
  padding: 20px;
  text-align: center;
}
.product {
  background-color: white;
  margin: 20px;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0px 2px 5px gray;
}
.product img {
  width: 150px;
  height: 150px;
  border-radius: 10px;
}
.product h3 {
  color: #333;
}
.price {
  color: green;
  font-weight: bold;
  font-size: 20px;
}
.buy-btn {
  background-color: #222;
  color: white;
  padding: 10px 25px;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="header">
<h1>Step Style Footwear</h1>
<p>Best jute aapke liye</p>
</div>

<div class="product">
<img src="https://placehold.co/150x150" alt="Sports Shoes">
<h3>Sports Shoes</h3>
<p class="price">Rs. 1299</p>
<button class="buy-btn">Buy Now</button>
</div>

<div class="product">
<img src="https://placehold.co/150x150" alt="Casual Sneakers">
<h3>Casual Sneakers</h3>
<p class="price">Rs. 999</p>
<button class="buy-btn">Buy Now</button>
</div>

<div class="product">
<img src="https://placehold.co/150x150" alt="Formal Shoes">
<h3>Formal Shoes</h3>
<p class="price">Rs. 1599</p>
<button class="buy-btn">Buy Now</button>
</div>

</body>
</html>
